<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Artemis Moon Mission</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial;
    background:black;
    color:white;
}

/* FUNDO */

#ceu{
    position:absolute;
    width:100%;
    height:100%;
    background:
    linear-gradient(
        to top,
        #09111f,
        #000000
    );
    overflow:hidden;
}

/* ESTRELAS */

.estrela{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:piscar 2s infinite;
}

@keyframes piscar{
    0%{opacity:0.2;}
    50%{opacity:1;}
    100%{opacity:0.2;}
}

/* LUA */

#lua{
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    background:#ddd;
    top:80px;
    right:40px;
    box-shadow:0 0 40px white;
    opacity:0;
    transition:1s;
}

/* TOPO */

.topo{
    position:absolute;
    top:0;
    width:100%;
    height:60px;
    background:#0f172a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    z-index:20;
}

/* MULTI */

#multi{
    position:absolute;
    top:90px;
    width:100%;
    text-align:center;
    font-size:70px;
    font-weight:bold;
    color:#22c55e;
    text-shadow:0 0 25px #22c55e;
    z-index:20;
}

/* STATUS */

#status{
    position:absolute;
    top:170px;
    width:100%;
    text-align:center;
    font-size:20px;
    z-index:20;
}

/* FOGUETE */

#foguete{
    position:absolute;
    width:80px;
    left:50%;
    bottom:100px;
    transform:translateX(-50%);
    transition:0.05s linear;
    z-index:15;
    filter:drop-shadow(0 0 20px orange);
}

/* FOGO */

.fogo{
    position:absolute;
    width:20px;
    height:50px;
    background:linear-gradient(
        orange,
        red,
        transparent
    );
    left:50%;
    bottom:-35px;
    transform:translateX(-50%);
    border-radius:50%;
    animation:fogo 0.1s infinite;
}

@keyframes fogo{
    0%{height:35px;}
    50%{height:55px;}
    100%{height:30px;}
}

/* PAINEL */

.painel{
    position:absolute;
    bottom:20px;
    width:100%;
    padding:15px;
    z-index:30;
}

input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:18px;
    margin-bottom:10px;
}

.botoes{
    display:flex;
    gap:10px;
}

button{
    flex:1;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    color:white;
    cursor:pointer;
}

.apostar{
    background:#22c55e;
}

.sacar{
    background:#ef4444;
}

</style>
</head>
<body>

<div id="ceu"></div>

<div id="lua"></div>

<div class="topo">
🚀 ARTEMIS MOON MISSION
</div>

<div id="multi">
1.00x
</div>

<div id="status">
⏳ Aguardando aposta...
</div>

<!-- FOGUETE -->

<div id="foguete">

<img
src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Rocket_icon.svg/512px-Rocket_icon.svg.png"
width="100%">

<div class="fogo"></div>

</div>

<!-- CONTROLES -->

<div class="painel">

<input
type="number"
id="valor"
placeholder="Digite o valor">

<div class="botoes">

<button
class="apostar"
onclick="apostar()">

Apostar

</button>

<button
class="sacar"
onclick="sacar()">

Sacar

</button>

</div>

</div>

<script>

/* ESTRELAS */

for(let i=0;i<150;i++){

    let estrela =
    document.createElement("div")

    estrela.className =
    "estrela"

    estrela.style.left =
    Math.random()*100+"%"

    estrela.style.top =
    Math.random()*100+"%"

    estrela.style.animationDelay =
    Math.random()*2+"s"

    document
    .getElementById("ceu")
    .appendChild(estrela)

}

/* VARIÁVEIS */

let multiplicador = 1.00

let rodando = false

let apostado = false

let sacou = false

let venceu = false

let iniciou = false

const foguete =
document.getElementById("foguete")

/* APOSTAR */

function apostar(){

    if(rodando) return

    apostado = true

    sacou = false

    venceu = false

    multiplicador = 1.00

    rodando = true

    iniciou = true

    document
    .getElementById("status")
    .innerHTML =
    "🚀 LANÇAMENTO INICIADO"

}

/* SACAR */

function sacar(){

    if(!apostado) return

    if(sacou) return

    if(!rodando) return

    sacou = true

    let valor =
    parseFloat(
        document
        .getElementById("valor")
        .value || 0
    )

    let ganho =
    (valor * multiplicador)
    .toFixed(2)

    document
    .getElementById("status")
    .innerHTML =
    "💰 SACOU R$ " + ganho

}

/* FASES */

function atualizarFases(){

    let status =
    document.getElementById("status")

    if(multiplicador >= 2){

        status.innerHTML =
        "☁ Saindo da atmosfera"

    }

    if(multiplicador >= 5){

        status.innerHTML =
        "🌌 Entrando no espaço"

    }

    if(multiplicador >= 15){

        status.innerHTML =
        "🛰 Órbita terrestre"

    }

    if(multiplicador >= 30){

        status.innerHTML =
        "🌕 Aproximando da Lua"

        document
        .getElementById("lua")
        .style.opacity = 1

    }

    if(multiplicador >= 50){

        venceu = true

        rodando = false

        document
        .getElementById("multi")
        .style.color =
        "#ffd700"

        status.innerHTML =
        "🏆 MISSÃO COMPLETA"

        foguete.innerHTML =
        "🌕"

        if(apostado && !sacou){

            status.innerHTML =
            "🏆 PRÊMIO MÁXIMO!"

        }

        setTimeout(
            novaMissao,
            4000
        )

    }

}

/* LOOP */

function loop(){

    if(rodando && iniciou){

        multiplicador *= 1.01

        document
        .getElementById("multi")
        .innerHTML =
        multiplicador.toFixed(2)
        + "x"

        atualizarFases()

        /* MOVIMENTO */

        let y =
        multiplicador * 12

        foguete.style.transform =
        `translate(-50%, -${y}px)`

        /* CRASH */

        if(!venceu){

            let chance =
            Math.random()

            if(
                multiplicador > 2
                &&
                chance < 0.002
            ){

                rodando = false

                foguete.innerHTML = "💥"

                document
                .getElementById("multi")
                .style.color =
                "#ef4444"

                document
                .getElementById("status")
                .innerHTML =
                "💥 EXPLODIU"

                if(apostado && !sacou){

                    document
                    .getElementById("status")
                    .innerHTML =
                    "💥 VOCÊ PERDEU"

                }

                navigator.vibrate?.(300)

                setTimeout(
                    novaMissao,
                    4000
                )

            }

        }

    }

    requestAnimationFrame(loop)

}

/* NOVA MISSÃO */

function novaMissao(){

    multiplicador = 1.00

    rodando = false

    apostado = false

    sacou = false

    venceu = false

    iniciou = false

    document
    .getElementById("multi")
    .style.color =
    "#22c55e"

    document
    .getElementById("multi")
    .innerHTML =
    "1.00x"

    document
    .getElementById("status")
    .innerHTML =
    "⏳ Aguardando aposta..."

    document
    .getElementById("lua")
    .style.opacity = 0

    foguete.innerHTML = `

    <img
    src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Rocket_icon.svg/512px-Rocket_icon.svg.png"
    width="100%">

    <div class="fogo"></div>

    `

    foguete.style.transform =
    "translate(-50%, 0px)"

}

/* INICIAR */

novaMissao()

loop()

</script>

</body>
</html>
