<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foguete Brasil</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050816;
    overflow:hidden;
    font-family:Arial;
    color:white;
}

/* FUNDO */

.fundo{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.estrela{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:piscar 2s infinite;
}

@keyframes piscar{
    0%{opacity:0.2;}
    50%{opacity:1;}
    100%{opacity:0.2;}
}

/* TOPO */

.topo{
    position:relative;
    z-index:20;
    height:60px;
    background:#0f172a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    box-shadow:0 0 10px black;
}

/* AREA */

.area{
    position:relative;
    width:100%;
    height:calc(100vh - 60px);
    overflow:hidden;
}

canvas{
    position:absolute;
    width:100%;
    height:100%;
}

/* FOGUETE */

#foguete{
    position:absolute;
    width:70px;
    left:50%;
    bottom:120px;
    transform:translateX(-50%);
    z-index:10;
    filter:drop-shadow(0 0 20px orange);
}

/* FOGO */

.fogo{
    position:absolute;
    width:18px;
    height:40px;
    background:linear-gradient(
        orange,
        red,
        transparent
    );
    left:50%;
    bottom:-30px;
    transform:translateX(-50%);
    border-radius:50%;
    animation:fogo 0.1s infinite;
}

@keyframes fogo{

    0%{
        height:35px;
    }

    50%{
        height:50px;
    }

    100%{
        height:30px;
    }

}

/* MULTIPLICADOR */

.multi{
    position:absolute;
    top:12%;
    width:100%;
    text-align:center;
    font-size:75px;
    font-weight:bold;
    color:#22c55e;
    text-shadow:0 0 25px #22c55e;
    z-index:20;
}

/* MSG */

.msg{
    position:absolute;
    top:5%;
    width:100%;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    z-index:20;
}

/* CONTROLES */

.painel{
    position:absolute;
    bottom:20px;
    width:100%;
    padding:15px;
    z-index:20;
}

input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:18px;
    margin-bottom:10px;
}

.botoes{
    display:flex;
    gap:10px;
}

button{
    flex:1;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    color:white;
}

.apostar{
    background:#22c55e;
}

.sacar{
    background:#ef4444;
}

@media(max-width:600px){

    .multi{
        font-size:55px;
    }

    #foguete{
        width:55px;
    }

}

</style>
</head>
<body>

<div class="fundo" id="fundo"></div>

<div class="topo">
    🚀 Brasil
</div>

<div class="area">

    <canvas id="grafico"></canvas>

    <div class="msg" id="msg"></div>

    <div class="multi" id="multi">
        1.00x
    </div>

    <!-- FOGUETE -->

    <div id="foguete">

        <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Rocket_icon.svg/512px-Rocket_icon.svg.png"
        width="100%">

        <div class="fogo"></div>

    </div>

    <!-- CONTROLES -->

    <div class="painel">

        <input
        type="number"
        id="valor"
        placeholder="Digite o valor">

        <div class="botoes">

            <button
            class="apostar"
            onclick="apostar()">

                Apostar

            </button>

            <button
            class="sacar"
            onclick="sacar()">

                Sacar

            </button>

        </div>

    </div>

</div>

<script>

const canvas =
document.getElementById("grafico")

const ctx =
canvas.getContext("2d")

function resize(){

    canvas.width =
    window.innerWidth

    canvas.height =
    window.innerHeight

}

resize()

window.addEventListener(
    "resize",
    resize
)

let multiplicador = 1.00

let crash = gerarCrash()

let rodando = true

let apostado = false

let sacou = false

let pontos = []

const foguete =
document.getElementById("foguete")

/* ESTRELAS */

for(let i=0;i<100;i++){

    let estrela =
    document.createElement("div")

    estrela.className =
    "estrela"

    estrela.style.left =
    Math.random()*100+"%"

    estrela.style.top =
    Math.random()*100+"%"

    estrela.style.animationDelay =
    Math.random()*2+"s"

    document
    .getElementById("fundo")
    .appendChild(estrela)

}

/* CRASH */

function gerarCrash(){

    return (
        Math.random()*8+1.2
    ).toFixed(2)

}

/* APOSTAR */

function apostar(){

    apostado = true

    sacou = false

    document
    .getElementById("msg")
    .innerHTML =
    "🚀 LANÇAMENTO INICIADO"

}

/* SACAR */

function sacar(){

    if(!apostado) return

    if(sacou) return

    if(!rodando) return

    sacou = true

    let valor =
    parseFloat(
        document
        .getElementById("valor")
        .value || 0
    )

    let ganho =
    (valor * multiplicador)
    .toFixed(2)

    document
    .getElementById("msg")
    .innerHTML =
    "💰 SACOU R$ " + ganho

}

/* GRAFICO */

function desenhar(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    )

    ctx.beginPath()

    ctx.lineWidth = 5

    ctx.strokeStyle =
    "#22c55e"

    ctx.shadowBlur = 20

    ctx.shadowColor =
    "#22c55e"

    for(let i=0;i<pontos.length;i++){

        let p = pontos[i]

        if(i==0){

            ctx.moveTo(
                p.x,
                p.y
            )

        }else{

            ctx.lineTo(
                p.x,
                p.y
            )

        }

    }

    ctx.stroke()

}

/* FOGUETE */

function atualizarFoguete(){

    let y =
    (canvas.height * 0.78)
    - (multiplicador * 45)

    if(y < 50){

        y = 50

    }

    foguete.style.transform =
    `translate(-50%, ${-multiplicador*45}px)`

}

/* LOOP */

function loop(){

    if(rodando){

        multiplicador *= 1.008

        document
        .getElementById("multi")
        .innerHTML =
        multiplicador.toFixed(2)
        + "x"

        pontos.push({

            x: canvas.width/2,

            y:
            (canvas.height * 0.85)
            - (multiplicador * 45)

        })

        desenhar()

        atualizarFoguete()

        if(multiplicador >= crash){

            rodando = false

            document
            .getElementById("multi")
            .style.color =
            "#ef4444"

            foguete.innerHTML = "💥"

            document
            .getElementById("msg")
            .innerHTML =
            "💥 EXPLODIU EM "
            + multiplicador.toFixed(2)
            + "x"

            if(apostado && !sacou){

                document
                .getElementById("msg")
                .innerHTML =
                "💥 VOCÊ PERDEU"

            }

            navigator.vibrate?.(300)

            setTimeout(
                reiniciar,
                3000
            )

        }

    }

    requestAnimationFrame(loop)

}

/* REINICIAR */

function reiniciar(){

    multiplicador = 1.00

    crash = gerarCrash()

    rodando = true

    apostado = false

    sacou = false

    pontos = []

    foguete.innerHTML = `

        <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Rocket_icon.svg/512px-Rocket_icon.svg.png"
        width="100%">

        <div class="fogo"></div>

    `

    foguete.style.transform =
    "translateX(-50%)"

    document
    .getElementById("multi")
    .style.color =
    "#22c55e"

    document
    .getElementById("msg")
    .innerHTML = ""

}

reiniciar()

loop()

</script>

</body>
</html>
